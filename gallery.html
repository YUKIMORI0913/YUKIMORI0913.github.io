<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Archive | 鰻谷饅頭</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body{background:#f7f5f1;color:#171614}.archive-header{padding:24px 0;border-bottom:1px solid #d7d2c9;background:#f7f5f1}.archive-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px}.archive-header .logo,.archive-back{color:#171614}.archive-back{font-size:11px;font-weight:900;letter-spacing:.12em;text-decoration:none}.archive-back:hover{opacity:.55}.archive-intro{padding:90px 0 50px}.archive-intro .eyebrow{color:#a72e27}.archive-intro h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(52px,9vw,130px);line-height:.85;letter-spacing:-.09em;margin:0}.archive-intro p{color:#605c55;max-width:520px;margin:28px 0 0}.archive-count{font-size:11px;font-weight:800;letter-spacing:.12em;color:#767067;margin:0 0 24px}.archive-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,2.3vw,42px) clamp(14px,1.5vw,28px);padding-bottom:52px}.archive-grid .photo-slot{height:auto;aspect-ratio:4 / 5;margin:0;border:0;background:#e7e3dc;cursor:zoom-in}.archive-grid .photo-slot img{filter:none}.archive-grid .photo-slot:hover img{transform:scale(1.025)}.archive-grid .photo-slot figcaption{position:static;padding:13px 0 0;background:none;color:#292724;font-size:10px;letter-spacing:.12em}.archive-pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:20px 0 110px}.archive-page{min-width:39px;height:39px;border:1px solid #bcb6ab;background:transparent;color:#25221e;display:inline-grid;place-items:center;font:800 11px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;cursor:pointer}.archive-page:hover,.archive-page[aria-current="page"]{background:#25221e;border-color:#25221e;color:#fff}.archive-next-page{min-width:auto;padding:0 17px}.archive-lightbox{width:min(1100px,94vw);max-height:92vh;padding:16px;background:#151310;border:1px solid #70644f;color:var(--paper)}.archive-lightbox::backdrop{background:rgba(8,7,6,.9);backdrop-filter:blur(8px)}.archive-lightbox img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain}.archive-lightbox p{margin:10px 4px 0;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.15em}.archive-lightbox button{position:absolute;z-index:2;border:0;background:rgba(20,17,14,.68);color:#fff;cursor:pointer}.archive-close{right:6px;top:5px;font-size:34px;line-height:1;padding:5px 11px}.archive-previous,.archive-next{top:50%;transform:translateY(-50%);width:48px;height:60px;font:400 46px/1 Georgia,serif}.archive-previous{left:8px}.archive-next{right:8px}@media(max-width:700px){.archive-header .wrap{padding:0 20px}.archive-intro{padding:58px 0 35px}.archive-grid{grid-template-columns:repeat(2,1fr);gap:28px 14px;padding-bottom:36px}.archive-grid .photo-slot{aspect-ratio:4 / 5}.archive-pagination{padding-bottom:68px}.archive-next-page{padding:0 12px}.archive-previous,.archive-next{width:40px;height:52px}}
  </style>
</head>
<body>
  <header class="archive-header"><div class="wrap"><a class="logo" href="/">UNAGITANI MANJU</a><a class="archive-back" href="/#gallery">← BACK TO TOP</a></div></header>
  <main><section class="wrap archive-intro"><p class="eyebrow">PHOTO ARCHIVE</p><h1>THE<br>COLLECTION.</h1><p>演奏、制作、京都の風景。鰻谷饅頭の写真を、新しいものから収録しています。</p></section><section class="wrap"><p class="archive-count" aria-live="polite"></p><div class="archive-grid" aria-label="写真アーカイブ"></div><nav class="archive-pagination" aria-label="写真アーカイブのページ送り"></nav></section></main>
  <dialog class="archive-lightbox" aria-label="写真の拡大表示"><button class="archive-close" type="button" aria-label="閉じる">×</button><button class="archive-previous" type="button" aria-label="前の写真">‹</button><img src="" alt=""><button class="archive-next" type="button" aria-label="次の写真">›</button><p></p></dialog>
  <script>
    (async () => {
      const response = await fetch('/');
      const source = new DOMParser().parseFromString(await response.text(), 'text/html');
      const photos = [...source.querySelectorAll('.photo-grid .photo-slot')].reverse();
      const grid = document.querySelector('.archive-grid'); const pagination = document.querySelector('.archive-pagination'); const count = document.querySelector('.archive-count'); const perPage = 20;
      const dialog = document.querySelector('.archive-lightbox');
      const image = dialog.querySelector('img'); const caption = dialog.querySelector('p'); let active = 0;
      const open = (index) => { active = index; const photo = photos[index]; const original = photo.querySelector('img'); image.src = original.src; image.alt = original.alt; caption.textContent = `${photo.querySelector('figcaption').textContent} — ${index + 1} / ${photos.length}`; if (!dialog.open) dialog.showModal(); };
      const render = (page) => { const total = Math.ceil(photos.length / perPage); const start = page * perPage; grid.replaceChildren(); photos.slice(start, start + perPage).forEach((photo, localIndex) => { const index = start + localIndex; const figure = photo.cloneNode(true); figure.tabIndex = 0; figure.addEventListener('click', () => open(index)); figure.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(index); } }); grid.append(figure); }); count.textContent = `COLLECTION ${String(page + 1).padStart(2, '0')}  /  ${photos.length} IMAGES`; pagination.replaceChildren(); for (let i = 0; i < total; i += 1) { const button = document.createElement('button'); button.className = 'archive-page'; button.textContent = i + 1; if (i === page) button.setAttribute('aria-current', 'page'); button.addEventListener('click', () => { render(i); window.scrollTo({ top: 0, behavior: 'smooth' }); }); pagination.append(button); } if (page < total - 1) { const nextPage = document.createElement('button'); nextPage.className = 'archive-page archive-next-page'; nextPage.textContent = 'NEXT →'; nextPage.addEventListener('click', () => { render(page + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }); pagination.append(nextPage); } };
      const step = (direction) => open((active + direction + photos.length) % photos.length);
      dialog.querySelector('.archive-close').addEventListener('click', () => dialog.close());
      dialog.querySelector('.archive-previous').addEventListener('click', () => step(-1));
      dialog.querySelector('.archive-next').addEventListener('click', () => step(1));
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      dialog.addEventListener('keydown', (event) => { if (event.key === 'ArrowLeft') step(-1); if (event.key === 'ArrowRight') step(1); });
      render(0);
    })();
  </script>
</body>
</html>
